name: Marín Jónsdóttir
titleIs: Gervigreindarsérfræðingur
titleEn: AI Specialist
noteIs: Leiðir samstarfsverkefnið Glóð
noteEn: Leads the Glóð partnership
bioIs: 'Marín fer fyrir samstarfsverkefninu Glóð og hefur yfirumsjón með dagsdaglegum rekstri þess ásamt því að setja verkefninu skýra stefnu og sjá til þess að öllum markmiðum þess sé náð. Marín heldur einnig erindi og kynningar um hagnýta notkun og innleiðingu gervigreindarlausna. Marín er ein af höfundum skýrslunnar „Staða gervigreindar á Íslandi.“'
bioEn: "Marín leads the Glóð partnership, overseeing its day-to-day operations, setting a clear direction for the project, and making sure it meets its goals. She also gives talks and presentations on the practical use and adoption of AI solutions. Marín is a co-author of The State of AI in Iceland."

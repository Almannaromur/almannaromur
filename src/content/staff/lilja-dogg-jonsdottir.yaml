bioIs: 'Lilja Dögg er framkvæmdastjóri Almannaróms og stýrir allri starfsemi stofnunarinnar í umboði stjórnar, sem ræður hana til verksins. Í starfinu felst meðal annars ábyrgð á gerð samninga við stærstu tæknifyrirtæki heims og úthlutun fjármagns til rannsókna og innviðauppbyggingar á sviði máltækni. Lilja er einnig einn höfunda skýrslunnar „Staða gervigreindar á Íslandi.“'
bioEn: "Lilja Dögg is Almannarómur's Managing Director and leads all of the organization's operations on behalf of the board, which appoints her. Her responsibilities include negotiating agreements with the world's largest technology companies and allocating funding for research and infrastructure in language technology. Lilja Dögg is also a co-author of the report The State of AI in Iceland."

name: Gísli Ragnar Guðmundsson
titleIs: Gervigreindarsérfræðingur
titleEn: AI Specialist
noteIs: Leiðir New Nordics AI á Íslandi
noteEn: Leads New Nordics AI in Iceland
bioIs: 'Gísli Ragnar leiðir og tekur virkan þátt í uppbyggingu á hinni samnorrænu gervigreindarmiðstöðv New Nordics AI ásamt því að fara fyrir innlendum verkefnum. Gísli heldur einnig erindi og kynningar um hagnýta notkun og innleiðingu gervigreindar. Gísli er einnig einn höfunda skýrslunnar „Staða gervigreindar á Íslandi.“'
bioEn: "Gísli Ragnar is helping build New Nordics AI, the joint Nordic AI center, and leads projects in Iceland. He gives talks and presentations on the practical use and adoption of AI. Gísli Ragnar is also a co-author of The State of AI in Iceland."

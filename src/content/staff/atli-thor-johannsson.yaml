bioIs: 'Atli Þór vinnur að þverfaglegum stefnumótunarverkefnum hjá Almannarómi með áherslu á gervigreind og samfélagsáhrif hennar. Hann ber einnig ábyrgð á tæknimálum miðstöðvarinnar. Atli er einn af stofnendum Samtaka um mannvæna tækni og einn höfunda skýrslunnar „Staða gervigreindar á Íslandi."'
bioEn: "Atli Þór works on interdisciplinary policy projects at Almannarómur, focusing on AI and its impact on society. He is also responsible for the center's technical operations. Atli Þór is a co-founder of Samtök um mannvæna tækni (the Association for Humane Technology) and a co-author of The State of AI in Iceland."

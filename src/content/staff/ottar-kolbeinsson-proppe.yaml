bioIs: 'Óttar er yfirmaður stefnu, samhæfingar og alþjóðamála hjá Almannarómi og sér um samhæfingu áhersluverkefna auk samskipta við helstu hagaðila stofnunarinnar. Hann leiðir einnig samskipti Almannaróms við erlend stórfyrirtæki og alþjóðastofnanir. Óttar er ritstjóri skýrslunnar „Staða gervigreindar á Íslandi“ ásamt því að birta þar efni.'
bioEn: "Óttar is Almannarómur's Head of Policy, Coordination and International Affairs. He coordinates priority projects and manages relationships with the organization's key stakeholders. He also leads the center's communication with major international companies and international organizations. Óttar is the editor of The State of AI in Iceland and also writes for it."
